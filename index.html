<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f5ff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>StudyFlow</title>
<style>
:root{--bg:#f7f5ff;--card:#fff;--text:#20202a;--muted:#8a8996;--line:#eceaf3;--primary:#7667e8;--primary2:#eeeaff;--danger:#e96f7b;--shadow:0 10px 30px rgba(75,61,130,.08)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html{background:var(--bg)}body{margin:0;background:linear-gradient(180deg,#f7f5ff 0,#fbfbff 55%,#f5f7ff 100%);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo","Noto Sans KR",sans-serif}button,input,select{font:inherit}button{border:0;cursor:pointer}.app{max-width:860px;margin:auto;min-height:100vh;padding:28px 18px calc(105px + env(safe-area-inset-bottom))}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:850;font-size:26px;letter-spacing:-.8px}.date{font-size:14px;color:var(--muted);margin-top:4px}.iconbtn{width:42px;height:42px;border-radius:15px;background:#fff;box-shadow:var(--shadow);font-size:19px}.screen{display:none}.screen.active{display:block}.card{background:rgba(255,255,255,.94);border:1px solid rgba(230,227,241,.8);border-radius:24px;padding:20px;margin:14px 0;box-shadow:var(--shadow)}h2{font-size:18px;margin:0 0 15px;letter-spacing:-.4px}.eyebrow{font-size:13px;color:var(--muted);font-weight:700}.big{font-size:54px;font-weight:800;letter-spacing:1px;text-align:center;margin:18px 0 22px;font-variant-numeric:tabular-nums}.subject{width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;background:#faf9ff;color:var(--text);outline:none}.row{display:flex;gap:10px;align-items:center}.row>*{min-width:0;flex:1}.btn{padding:14px 16px;border-radius:16px;font-weight:750}.primary{background:var(--primary);color:#fff;box-shadow:0 8px 18px rgba(118,103,232,.22)}.soft{background:var(--primary2);color:#5d51c9}.gray{background:#f1f1f5;color:#444}.danger{background:#fff0f1;color:#c54f5b}.btn:active,.iconbtn:active{transform:scale(.98)}.timerState{text-align:center;color:var(--muted);font-size:13px;min-height:20px}.statsGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.mini{padding:17px;border-radius:20px;background:#faf9ff;border:1px solid var(--line)}.mini strong{display:block;font-size:23px;margin-top:5px}.progress{height:11px;background:#eeeef4;border-radius:99px;overflow:hidden}.bar{height:100%;background:linear-gradient(90deg,#8b7cf1,#6d60df);width:0%;transition:width .35s}.goalLine{display:flex;justify-content:space-between;margin:10px 0;color:var(--muted);font-size:13px}.task{display:flex;align-items:center;gap:11px;padding:13px 0;border-bottom:1px solid var(--line)}.task:last-child{border-bottom:0}.task input{width:21px;height:21px;accent-color:var(--primary);flex:0 0 auto}.taskText{flex:1;word-break:break-word}.done{text-decoration:line-through;color:#aaa}.deleteTask{background:transparent;color:#bbb;font-size:18px;padding:4px}.input{width:100%;padding:14px;border:1px solid var(--line);border-radius:16px;background:#fff;outline:none}.input:focus{border-color:#b9b1ff;box-shadow:0 0 0 3px #eeeaff}.empty{text-align:center;color:#aaa;padding:22px 8px}.historyItem{padding:15px 0;border-bottom:1px solid var(--line)}.historyItem:last-child{border-bottom:0}.historyTop{display:flex;justify-content:space-between;gap:10px}.historySub{font-weight:750}.historyDate{color:var(--muted);font-size:12px;margin-top:4px}.historyTime{font-weight:800}.dayRow{display:flex;align-items:center;gap:10px;margin:11px 0}.dayLabel{width:74px;font-size:13px;color:var(--muted)}.dayBar{flex:1;height:10px;background:#eeeef4;border-radius:99px;overflow:hidden}.dayBar span{display:block;height:100%;background:#8779ed;border-radius:99px}.dayTime{width:70px;text-align:right;font-size:13px;font-weight:700}.subjectRow{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.subjectRow:last-child{border:0}.bottom{position:fixed;z-index:10;left:0;right:0;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-top:1px solid #e9e7ef;padding:9px 10px calc(9px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:6px}.tab{flex:1;max-width:180px;background:transparent;color:#92919c;border-radius:16px;padding:10px 4px;font-size:12px;font-weight:700}.tab .ico{display:block;font-size:20px;margin-bottom:2px}.tab.active{background:#efecff;color:#6559d5}.modalBack{position:fixed;inset:0;background:rgba(25,22,40,.32);display:none;align-items:flex-end;justify-content:center;z-index:30}.modalBack.show{display:flex}.modal{width:min(860px,100%);background:#fff;border-radius:28px 28px 0 0;padding:22px 18px calc(24px + env(safe-area-inset-bottom));box-shadow:0 -15px 45px rgba(0,0,0,.15)}.modal h3{margin:0 0 15px}.modalBtns{display:flex;gap:10px;margin-top:15px}.toast{position:fixed;z-index:50;left:50%;bottom:90px;transform:translateX(-50%) translateY(15px);background:#25242d;color:#fff;padding:11px 15px;border-radius:14px;font-size:13px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}@media(min-width:700px){.statsGrid{grid-template-columns:repeat(4,1fr)}.card{padding:24px}.app{padding-top:38px}}
</style>
</head>
<body>
<div class="app">
  <header class="top"><div><div class="brand">StudyFlow 🌷</div><div class="date" id="dateText"></div></div><button class="iconbtn" id="goalBtn" aria-label="목표 설정">⚙️</button></header>
  <div class="dateNav card" style="padding:10px;margin-top:0;display:flex;align-items:center;gap:8px;position:sticky;top:8px;z-index:8">
    <button class="btn gray" id="prevDate" style="padding:10px 14px;flex:0 0 auto">‹</button>
    <button class="btn soft" id="todayDate" style="padding:10px 14px;flex:0 0 auto">오늘</button>
    <div id="selectedDateLabel" style="flex:1;text-align:center;font-weight:800;font-size:14px"></div>
    <button class="btn gray" id="nextDate" style="padding:10px 14px;flex:0 0 auto">›</button>
  </div>

  <main>
    <section id="home" class="screen active">
      <div class="card">
        <div class="eyebrow">TODAY'S STUDY</div><div class="big" style="text-align:left;font-size:38px;margin:9px 0 16px" id="homeTotal">0시간 0분</div>
        <div class="goalLine"><span>오늘 목표</span><span id="goalLabel">4시간</span></div><div class="progress"><div class="bar" id="goalBar"></div></div>
      </div>
      <div class="statsGrid"><div class="mini"><span class="eyebrow">이번 주</span><strong id="weekTotal">0시간</strong></div><div class="mini"><span class="eyebrow">전체 공부</span><strong id="allTotal">0시간</strong></div><div class="mini"><span class="eyebrow">오늘 계획</span><strong id="taskCount">0/0</strong></div><div class="mini"><span class="eyebrow">연속 공부일</span><strong id="streak">0일</strong></div></div>
      <div class="card"><h2>오늘의 계획</h2><div id="homeTasks"></div></div>
      <div class="card"><h2>최근 공부 기록</h2><div id="homeHistory"></div></div>
    </section>

    <section id="timer" class="screen">
      <div class="card"><div class="eyebrow">FOCUS TIMER</div><h2 style="margin-top:6px">지금 공부할 과목</h2><select class="subject" id="subject"><option>수학</option><option>영어</option><option>국어</option><option>생명과학</option><option>화학</option><option>물리학</option><option>한국사</option><option>기타</option></select>
        <div class="big" id="clock">00:00:00</div><div class="timerState" id="timerState">공부를 시작해보세요.</div>
        <div class="row" style="margin-top:16px"><button class="btn primary" id="startBtn">▶ 시작</button><button class="btn gray" id="finishBtn">■ 공부 끝내기</button></div>
        <button class="btn danger" id="resetBtn" style="width:100%;margin-top:10px">현재 타이머 초기화</button>
      </div>
      <div class="card"><h2>오늘 과목별 공부시간</h2><div id="subjectStats"></div></div>
    </section>

    <section id="planner" class="screen"><div class="card"><div class="eyebrow">TODAY PLANNER</div><h2 style="margin-top:6px">오늘 할 일</h2><div class="row"><input class="input" id="taskInput" placeholder="예: 생명과학 3단원 복습"><button class="btn primary" id="addTask">추가</button></div><div id="tasks" style="margin-top:10px"></div></div></section>

    <section id="stats" class="screen"><div class="card"><h2>공부 통계</h2><div id="weekList"></div></div><div class="card"><h2>과목별 누적</h2><div id="allSubjects"></div></div><div class="card"><h2>전체 공부 기록</h2><div id="history"></div></div><div class="card"><div class="row"><button class="btn soft" id="exportBtn">기록 백업</button><button class="btn gray" id="importBtn">기록 복원</button></div><input type="file" id="fileInput" accept="application/json" hidden></div></section>
  </main>
</div>
<nav class="bottom"><button class="tab active" data-tab="home"><span class="ico">🏠</span>홈</button><button class="tab" data-tab="timer"><span class="ico">⏱️</span>타이머</button><button class="tab" data-tab="planner"><span class="ico">📝</span>플래너</button><button class="tab" data-tab="stats"><span class="ico">📊</span>기록</button></nav>

<div class="modalBack" id="modal"><div class="modal"><h3>하루 공부 목표</h3><div class="row"><input class="input" id="goalInput" type="number" min="1" max="24" step="0.5" placeholder="시간"><span>시간</span></div><div class="modalBtns"><button class="btn gray" id="closeModal" style="flex:1">취소</button><button class="btn primary" id="saveGoal" style="flex:1">저장</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='studyflow_v2';
const defaultData={sessions:[],tasks:[],goalHours:4,active:null};
let data=load();let tick=null;let selectedDate=keyOf();
function load(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');return {...defaultData,...(x||{})}}catch{return {...defaultData}}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function keyOf(d=new Date()){const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');return `${y}-${m}-${day}`}
function parseKey(k){return new Date(k+'T00:00:00')}
function label(k){return parseKey(k).toLocaleDateString('ko-KR',{year:'numeric',month:'long',day:'numeric',weekday:'long'})}
function shortLabel(k){return parseKey(k).toLocaleDateString('ko-KR',{month:'numeric',day:'numeric',weekday:'short'})}
function fmt(sec){sec=Math.max(0,Math.floor(sec));const h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return h?`${h}시간 ${m}분`:m?`${m}분 ${s}초`:`${s}초`}
function clockFmt(sec){sec=Math.max(0,Math.floor(sec));return [Math.floor(sec/3600),Math.floor(sec%3600/60),sec%60].map(x=>String(x).padStart(2,'0')).join(':')}
function dayTotal(k){return data.sessions.filter(x=>x.date===k).reduce((a,x)=>a+x.seconds,0)}
function esc(s){return String(s).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function activeSeconds(){if(!data.active)return 0;return data.active.elapsed+Math.max(0,Math.floor((Date.now()-data.active.startedAt)/1000))}
function renderTimer(){const sec=activeSeconds();document.getElementById('clock').textContent=clockFmt(sec);if(data.active){document.getElementById('startBtn').textContent='⏸ 일시정지';document.getElementById('timerState').textContent=`${data.active.subject} · ${label(data.active.date)} · 저장 전 누적 ${fmt(sec)}`}else{document.getElementById('startBtn').textContent='▶ 시작';document.getElementById('timerState').textContent='공부를 시작해보세요.'}}
function render(){
 const today=selectedDate,total=dayTotal(today),goal=data.goalHours*3600;
 document.getElementById('dateText').textContent=label(keyOf());
 document.getElementById('selectedDateLabel').textContent=label(selectedDate);
 document.getElementById('homeTotal').textContent=fmt(total);document.getElementById('goalLabel').textContent=`${data.goalHours}시간`;document.getElementById('goalBar').style.width=Math.min(100,total/goal*100)+'%';
 let week=0,days=[];for(let i=6;i>=0;i--){const d=new Date();d.setHours(0,0,0,0);d.setDate(d.getDate()-i);const k=keyOf(d),t=dayTotal(k);week+=t;days.push([k,t])}
 document.getElementById('weekTotal').textContent=fmtShort(week);document.getElementById('allTotal').textContent=fmtShort(data.sessions.reduce((a,x)=>a+x.seconds,0));
 const ts=data.tasks.filter(x=>x.date===today),done=ts.filter(x=>x.done).length;document.getElementById('taskCount').textContent=`${done}/${ts.length}`;document.getElementById('streak').textContent=calcStreak()+'일';
 document.getElementById('tasks').innerHTML=taskHTML(ts);document.getElementById('homeTasks').innerHTML=ts.length?taskHTML(ts):'<div class="empty">오늘의 계획을 추가해보세요.</div>';
 const recent=[...data.sessions].sort((a,b)=>b.savedAt-a.savedAt).slice(0,4);document.getElementById('homeHistory').innerHTML=recent.length?recent.map(historyHTML).join(''):'<div class="empty">아직 공부 기록이 없어요.</div>';
 const by={};data.sessions.filter(x=>x.date===today).forEach(x=>by[x.subject]=(by[x.subject]||0)+x.seconds);document.getElementById('subjectStats').innerHTML=Object.keys(by).length?Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="subjectRow"><span>${esc(s)}</span><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">오늘 저장된 공부 기록이 없어요.</div>';
 document.getElementById('weekList').innerHTML=days.map(([k,t])=>`<div class="dayRow"><span class="dayLabel">${shortLabel(k)}</span><div class="dayBar"><span style="width:${Math.min(100,t/Math.max(goal,1)*100)}%"></span></div><span class="dayTime">${fmtShort(t)}</span></div>`).join('');
 const all={};data.sessions.forEach(x=>all[x.subject]=(all[x.subject]||0)+x.seconds);document.getElementById('allSubjects').innerHTML=Object.keys(all).length?Object.entries(all).sort((a,b)=>b[1]-a[1]).map(([s,v])=>`<div class="subjectRow"><span>${esc(s)}</span><b>${fmt(v)}</b></div>`).join(''):'<div class="empty">기록이 쌓이면 과목별 통계가 보여요.</div>';
 document.getElementById('history').innerHTML=data.sessions.length?[...data.sessions].sort((a,b)=>b.savedAt-a.savedAt).map(historyHTML).join(''):'<div class="empty">아직 공부 기록이 없어요.</div>';
 renderTimer();save();
}
function fmtShort(s){s=Math.floor(s);const h=Math.floor(s/3600),m=Math.floor(s%3600/60);return h?`${h}시간 ${m}분`:m?`${m}분`:'0분'}
function taskHTML(ts){return ts.length?ts.map(t=>`<div class="task"><input type="checkbox" ${t.done?'checked':''} onchange="toggleTask('${t.id}')"><span class="taskText ${t.done?'done':''}">${esc(t.text)}</span><button class="deleteTask" onclick="deleteTask('${t.id}')">×</button></div>`).join(''):'<div class="empty">오늘의 계획을 추가해보세요.</div>'}
function historyHTML(x){return `<div class="historyItem"><div class="historyTop"><div><div class="historySub">${esc(x.subject)}</div><div class="historyDate">${label(x.date)}</div></div><div class="historyTime">${fmt(x.seconds)}</div></div></div>`}
function calcStreak(){let n=0,d=new Date();d.setHours(0,0,0,0);while(dayTotal(keyOf(d))>0){n++;d.setDate(d.getDate()-1)}return n}
function startTimer(){if(data.active)return;data.active={subject:document.getElementById('subject').value,date:selectedDate,startedAt:Date.now(),elapsed:0};save();renderTimer();if(!tick)tick=setInterval(renderTimer,500);toast('공부 타이머를 시작했어요!')}
function pauseTimer(){if(!data.active)return;data.active.elapsed=activeSeconds();data.active.startedAt=0;data.active.paused=true;save();renderTimer();clearInterval(tick);tick=null;toast('일시정지했어요.')}
function resumeTimer(){if(!data.active)return;data.active.startedAt=Date.now();data.active.paused=false;save();renderTimer();if(!tick)tick=setInterval(renderTimer,500);toast('다시 시작했어요.')}
function finishTimer(){if(!data.active)return toast('진행 중인 타이머가 없어요.');const sec=activeSeconds();if(sec<1)return;data.sessions.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:data.active.date,subject:data.active.subject,seconds:sec,savedAt:Date.now()});data.active=null;save();clearInterval(tick);tick=null;render();toast(`${fmt(sec)} 공부 기록을 저장했어요.`)}
function resetTimer(){if(!data.active)return; if(confirm('현재 타이머를 저장하지 않고 초기화할까요?')){data.active=null;save();clearInterval(tick);tick=null;render();toast('타이머를 초기화했어요.')}}
document.getElementById('startBtn').onclick=()=>data.active?(data.active.paused?resumeTimer():pauseTimer()):startTimer();document.getElementById('finishBtn').onclick=finishTimer;document.getElementById('resetBtn').onclick=resetTimer;
document.getElementById('subject').onchange=()=>{if(data.active&&!data.active.paused)document.getElementById('subject').value=data.active.subject};
document.getElementById('addTask').onclick=addTask;document.getElementById('taskInput').addEventListener('keydown',e=>{if(e.key==='Enter')addTask()});function addTask(){const el=document.getElementById('taskInput'),v=el.value.trim();if(!v)return;data.tasks.push({id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),date:selectedDate,text:v,done:false});el.value='';save();render();toast('계획을 추가했어요.')}
window.toggleTask=id=>{const t=data.tasks.find(x=>x.id===id);if(t){t.done=!t.done;save();render()}};window.deleteTask=id=>{data.tasks=data.tasks.filter(x=>x.id!==id);save();render()};
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(b.dataset.tab).classList.add('active');render()});
function changeDate(delta){
  const d=parseKey(selectedDate);
  d.setDate(d.getDate()+delta);
  selectedDate=keyOf(d);
  render();
  toast(`날짜를 ${shortLabel(selectedDate)}로 변경했어요.`);
}
document.getElementById('prevDate').onclick=()=>changeDate(-1);
document.getElementById('nextDate').onclick=()=>changeDate(1);
document.getElementById('todayDate').onclick=()=>{selectedDate=keyOf();render();toast('오늘 날짜로 돌아왔어요.')};

const modal=document.getElementById('modal');document.getElementById('goalBtn').onclick=()=>{document.getElementById('goalInput').value=data.goalHours;modal.classList.add('show')};document.getElementById('closeModal').onclick=()=>modal.classList.remove('show');document.getElementById('saveGoal').onclick=()=>{const v=Number(document.getElementById('goalInput').value);if(v>=1&&v<=24){data.goalHours=v;save();render();modal.classList.remove('show');toast('목표를 저장했어요.')}};
document.getElementById('exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`StudyFlow-백업-${keyOf()}.json`;a.click();URL.revokeObjectURL(a.href);toast('백업 파일을 만들었어요.')};document.getElementById('importBtn').onclick=()=>document.getElementById('fileInput').click();document.getElementById('fileInput').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.sessions)||!Array.isArray(x.tasks))throw 0;data={...defaultData,...x,active:null};save();render();toast('기록을 복원했어요.')}catch{alert('올바른 StudyFlow 백업 파일이 아니에요.')}};r.readAsText(f);e.target.value=''};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>el.classList.remove('show'),1800)}
window.addEventListener('beforeunload',()=>{if(data.active){data.active.elapsed=activeSeconds();data.active.startedAt=data.active.paused?0:Date.now();save()}});document.addEventListener('visibilitychange',()=>{if(!document.hidden&&data.active)renderTimer()});
render();if(data.active&&!data.active.paused)tick=setInterval(renderTimer,500);
</script>
</body></html>
